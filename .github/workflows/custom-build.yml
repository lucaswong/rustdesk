name: Custom Full Platform Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact: windows-x64
          - os: ubuntu-latest
            target: linux
            artifact: linux-x64
          - os: macos-14
            target: macos
            artifact: macos-arm64
          - os: ubuntu-latest
            target: android
            artifact: android-apk

    steps:
      - name: Checkout with private submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # ========== Windows ==========
      - name: Build Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          cd flutter
          flutter build windows --release

      - name: Upload Windows
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-${{ matrix.artifact }}
          path: flutter/build/windows/x64/runner/Release/
          retention-days: 14

      # ========== Linux ==========
      - name: Build Linux
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-randr0-dev libxdo-dev libxfixes-dev libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev libpulse-dev cmake
          flutter config --enable-linux-desktop
          cd flutter
          flutter build linux --release

      - name: Upload Linux
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-${{ matrix.artifact }}
          path: flutter/build/linux/x64/release/bundle/
          retention-days: 14

      # ========== macOS ==========
      - name: Build macOS
        if: matrix.target == 'macos'
        run: |
          flutter config --enable-macos-desktop
          cd flutter
          flutter build macos --release

      - name: Upload macOS
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-${{ matrix.artifact }}
          path: flutter/build/macos/Build/Products/Release/
          retention-days: 14

      # ========== Android ==========
      - name: Setup Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Android APK
        if: matrix.target == 'android'
        run: |
          flutter build apk --release

      - name: Upload Android APK
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-${{ matrix.artifact }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14